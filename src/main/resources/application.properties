spring.application.name=json-agent-spring-demo
server.port=8090

# Expose the Actuator endpoints the json_api agent is most often pointed at
management.endpoints.web.exposure.include=health,info,metrics
# Show components[*].status and their details, as a real service would for monitoring
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# The custom DEGRADED status ranks between DOWN and UP; DOWN answers HTTP 503
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UNKNOWN,UP
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.degraded=200

management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=json-agent-spring-demo
info.app.version=1.4.2
info.app.region=eu-central
